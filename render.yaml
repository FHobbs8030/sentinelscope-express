services:
  - type: web
    name: sentinelscope-express
    runtime: node
    plan: free
    branch: feature/predictive-intelligence-dashboard
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: CLIENT_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true
